[project]
name = "mlx-openai-server"
version = "1.0.0"
description = "OpenAI compatible API server for TTS, STT and VLM on Apple silicon  via MLX"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "mlx-audio[tts,stt] @ git+https://github.com/Blaizzy/mlx-audio.git",
    "mlx-vlm",
    "torch",
    "torchvision",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = ["transformers>=4.45,<5"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true