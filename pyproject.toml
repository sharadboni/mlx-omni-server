[project]
name = "mlx-openai-server"
version = "1.0.0"
description = "OpenAI compatible API server for TTS, STT and VLM on Apple silicon  via MLX"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "mlx-audio[tts,stt] @ git+https://github.com/Blaizzy/mlx-audio.git",
    "mlx-vlm",
    "torch",
    "torchvision",
    "spacy",
    "rustymimi==0.4.1",
    "sentencepiece>=0.2.0",
    "huggingface_hub",
    "sounddevice>=0.5.3",
    "websockets>=16.0",
    "mlx-lm",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: load real models and hit real endpoints (deselected by default)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
override-dependencies = ["transformers>=4.45,<5", "mlx-lm>=0.31.1"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
